<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH · 爱芮挂件预览</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; color: #2b3040; background: #eef1f7; }
  .page { padding: 40px 48px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #667; margin: 0 0 6px; }
  .cards { display: flex; gap: 16px; margin-top: 28px; }
  .card { width: 280px; height: 140px; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(30,40,80,.08); padding: 16px; }
</style>
</head>
<body>
<div id="root">
<div class="page">
  <h1>DeepSeek Harness（本地预览）</h1>
  <p>右下角应当出现爱芮；这是挂件真实前端 + 模拟的 /dsh-whale/* 接口。</p>
  <div class="cards">
    <div class="card">余额卡片占位</div>
    <div class="card">今日用量占位</div>
  </div>
  <div data-composer-input="true" style="height:40px;border-radius:10px;background:#fff;margin-top:24px"></div>
</div>
</div>
<script>
  try {
    var wantRole = new URLSearchParams(location.search).get('role')
    localStorage.setItem('dshw-role', wantRole || 'airui')
  } catch (err) {}
  if (location.search.indexOf('click=1') >= 0) {
    setTimeout(function () { try { window.ZZZPet && window.ZZZPet.onClick() } catch (err) {} }, 2500)
  }
  if (location.search.indexOf('click=6') >= 0) {
    for (var ci = 0; ci < 6; ci++) {
      (function (i) { setTimeout(function () { try { window.ZZZPet && window.ZZZPet.onClick() } catch (err) {} }, 1900 + i * 90) })(ci)
    }
  }
  if (location.search.indexOf('menu=1') >= 0) {
    setTimeout(function () {
      try {
        var b = document.querySelector('.dshwv-menu-btn')
        if (b) b.click()
      } catch (err) {}
    }, 2600)
  }
  if (location.search.indexOf('gaze=1') >= 0) {
    setTimeout(function () {
      try {
        document.dispatchEvent(new PointerEvent('pointermove', { clientX: 1100, clientY: 700, bubbles: true }))
      } catch (err) {}
    }, 3000)
  }
  setTimeout(function () {
    if (location.search.indexOf('dbg=1') === -1) return
    function rect(el) { if (!el) return null; var r = el.getBoundingClientRect(); return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) } }
    var root = document.querySelector('.dshwv-root')
    var img = document.querySelector('.dshwv-img')
    var canvas = document.querySelector('.dshwv-canvas')
    var dbg = document.createElement('pre')
    dbg.id = 'dbg'
    dbg.textContent = 'DBG ' + JSON.stringify({
      root: rect(root), img: rect(img), canvas: rect(canvas),
      imgCss: img ? getComputedStyle(img).width + '/' + getComputedStyle(img).objectFit : null,
      clip: img ? (img.style.clipPath || '').slice(0, 24) : null,
      canvasCss: canvas ? getComputedStyle(canvas).width : null,
      zzz: !!window.ZZZPet, active: window.ZZZPet ? window.ZZZPet.isActive() : false,
      dbg: window.ZZZPet ? window.ZZZPet.debug() : null,
      role: (function () { try { return localStorage.getItem('dshw-role') } catch (e) { return '?' } })(),
      rolePanel: !!document.querySelector('.dshwv-rolelist'),
      roleItems: document.querySelectorAll('.dshwv-roleitem').length,
      roleNames: Array.prototype.map.call(document.querySelectorAll('.dshwv-roleitem'), function (e) { return e.textContent }).slice(0, 4),
    })
    document.body.appendChild(dbg)
  }, 3800)
</script>
<script src="/dsh-whale/zzz/pet.js"></script>
<script src="/dsh-whale/widget.js"></script>
</body>
</html>
